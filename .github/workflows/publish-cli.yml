name: Publish CLI (npm + MCP registry)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing + MCP registry

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 的版本取自根目录 package.json 的 packageManager。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest

      # The CLI is part of the pnpm workspace: install from the root lockfile.
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @smails/cli run build

      # OIDC auth is auto-detected; provenance is automatic for public repos.
      # Skip when this version is already on npm, so the workflow can be re-run
      # (e.g. after the MCP registry step failed) without failing here.
      - name: Publish to npm
        working-directory: cli
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@smails/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@smails/cli@$VERSION is already on npm; skipping"
          else
            npm publish
          fi

      # The MCP registry checks that the npm version exists, and a fresh publish
      # takes a moment to appear: wait for it (up to 5 minutes).
      - name: Wait for the version to appear on npm
        run: |
          VERSION=$(node -p "require('./cli/package.json').version")
          for i in $(seq 1 30); do
            npm view "@smails/cli@$VERSION" version >/dev/null 2>&1 && exit 0
            echo "waiting for @smails/cli@$VERSION on npm ($i/30)…"
            sleep 10
          done
          echo "@smails/cli@$VERSION did not appear on npm in time" >&2
          exit 1

      # --- Publish the MCP server to the official registry (OIDC, no secrets) ---

      - name: Install mcp-publisher
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # Keep server.json's version in sync with the package we just published
      - name: Sync server.json version
        run: |
          VERSION=$(node -p "require('./cli/package.json').version")
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
