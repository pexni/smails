name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 的版本取自根目录 package.json 的 packageManager。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 类型检查 + oxlint + oxfmt
      - run: pnpm run check

      - run: pnpm --filter smails-web run build

      # 测试用 .env.example 里的本地开发密钥；端到端测试会在本机启动 Worker 开发服务器。
      - run: cp worker/.env.example worker/.env

      - run: pnpm -r run test
